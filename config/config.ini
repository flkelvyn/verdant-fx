; Verdant FX v0.1.0 — config.ini
; Contém SOMENTE parâmetros efetivamente implementados.
; Os valores são CONSERVADORES e NÃO foram ajustados com testes no jogo.
; Em jogo: Ctrl+Alt+V liga/desliga | Ctrl+Alt+R recarrega este arquivo.

[General]
Enabled=1
; performance | balanced | quality | custom
; Só com "custom" os valores de [Sharpen] são lidos; nos outros perfis são ignorados.
Profile=balanced
; 0 = só erros, 1 = informações, 2 = depuração
LogLevel=1

[Sharpen]
; Para ajustar manualmente: troque Profile=custom acima e remova o ';' das linhas abaixo.
; Faixa 0.0 a 1.0 (exceto Taps). Valores abaixo = padrão do perfil balanced.
;Intensity=0.45
;HaloSuppression=0.60
;EdgePreservation=0.50
;NoiseControl=0.40
; 0 = nitidez igual em toda a imagem; 1 = quase só em tons de vegetação (heurística de cor)
;VegetationFocus=0.65
; 5 ou 9 amostras por pixel (5 = mais leve)
;Taps=9
